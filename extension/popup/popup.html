<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Streakhire</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="stripe"></div>

  <header class="header">
    <div class="brand">
      <svg viewBox="0 0 44 44" class="logo" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="20.5" stroke="currentColor" stroke-width="1.5" />
        <circle cx="22" cy="22" r="16" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 3.5" />
        <path d="M13 22.5L19.5 28L31 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Streakhire</span>
    </div>
    <div id="profile" class="profile hidden">
      <img id="profile-photo" class="avatar" alt="" />
      <button id="sign-out-btn" class="link-btn">Sign out</button>
    </div>
  </header>

  <main id="signed-out-view" class="view">
    <p class="tagline">Postmarks every application the instant you hit submit.</p>
    <button id="sign-in-btn" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9C16.5 14.1 17.64 11.9 17.64 9.2z"/><path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 009 18z"/><path fill="#fff" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.7V4.97H.9A9 9 0 000 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#fff" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <p class="fineprint">Your data stays tied to your Google account. Nothing is shared.</p>
  </main>

  <main id="signed-in-view" class="view hidden">
    <section class="streak-card">
      <div class="streak-card-top">
        <div>
          <p class="label">Current streak</p>
          <p id="streak-count" class="streak-number">0 days</p>
        </div>
        <div id="streak-days" class="streak-days"></div>
      </div>
      <p id="streak-longest" class="fineprint"></p>
    </section>

    <section class="log-section">
      <button id="manual-log-btn" class="btn-secondary">+ Log an application manually</button>
      <form id="manual-log-form" class="manual-form hidden">
        <input id="manual-company" type="text" placeholder="Company" required />
        <input id="manual-role" type="text" placeholder="Role" required />
        <input id="manual-resume" type="text" placeholder="Resume file used (optional)" />
        <div class="manual-form-actions">
          <button type="submit" class="btn-primary btn-sm">Postmark it</button>
          <button type="button" id="manual-cancel-btn" class="btn-ghost btn-sm">Cancel</button>
        </div>
      </form>
    </section>

    <section class="recent-section">
      <p class="label">Recently postmarked</p>
      <ul id="recent-list" class="recent-list"></ul>
      <p id="recent-empty" class="fineprint hidden">Nothing logged yet — go apply somewhere.</p>
    </section>

    <button id="open-dashboard-btn" class="btn-secondary dashboard-btn">Open full dashboard →</button>
  </main>

  <footer class="footer">
    <span id="status-text" class="status-text"></span>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
